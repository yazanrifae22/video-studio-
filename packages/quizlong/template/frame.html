<!--
  quiz-long picture template, direction blocks «مكعبات» (research/quiz-longform-2026-11-12/show-contract.md).
  1920x1080, CSS 3D + DOM text, deterministic (no wall clock, no unseeded random, no network).
    await window.__load(show[, {drift:false}])   parsed show.json; preloads fonts, flags, emoji; safe to call twice
    window.__seek(tSeconds)                      absolute episode time; pure function of t
    window.__ready === true                      after load
    window.__static(t0, t1[, {ignore_drift}])    true when no pixel changes between t0 and t1 (see frame.js header)
    window.__info() / window.__lint() / window.__sig()   dev helpers
  Standalone preview: frame.html?show=<url of show.json>&t=12.5[&drift=0]   (arrow keys scrub, shift = 1 s)
-->
<body>
<div id="canvas">
  <div id="bgPrev" class="bg th-l1"></div>
  <div id="bg" class="bg th-l1"></div>
  <div id="world" class="th-l1"><div id="rig"></div></div>
  <div id="measure" class="tx"></div>
</div>
<script src="frame.js"></script>
</body>
